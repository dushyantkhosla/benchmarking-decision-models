[project]
name = "decision-model-benchmark"
version = "0.1.0"
description = "Benchmarking small decision models for text-based application decisions"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.28",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
